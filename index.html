<!doctype html>
<html lang="en">
<head>

<title>PayConnect Excel Submission</title>
<style>html,body{margin:0}body{background:#F4F6F8;font-family:'Kanit',system-ui,sans-serif}</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var COMPONENTS = {};

  // ---------- template compile ----------
  function parseParts(str) {
    var parts = [], re = /\{\{\s*([^}]*?)\s*\}\}/g, last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) parts.push(str.slice(last, m.index));
      parts.push({ p: m[1] });
      last = re.lastIndex;
    }
    if (last < str.length) parts.push(str.slice(last));
    return parts;
  }
  function compileNodes(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var c = compileNode(list[i]);
      if (c) out.push(c);
    }
    return out;
  }
  function attrList(node) {
    var a = [];
    for (var i = 0; i < node.attributes.length; i++) {
      var at = node.attributes[i];
      a.push([at.name, parseParts(at.value)]);
    }
    return a;
  }
  function compileNode(n) {
    if (n.nodeType === 3) return { k: 't', parts: parseParts(n.nodeValue) };
    if (n.nodeType !== 1) return null;
    var tag = n.localName;
    if (tag === 'template' && n.getAttribute('data-dc')) {
      var kind = n.getAttribute('data-dc');
      var kids = compileNodes(n.content.childNodes);
      if (kind === 'sc-for') return { k: 'for', list: parseParts(n.getAttribute('list') || ''), as: n.getAttribute('as') || 'item', kids: kids };
      if (kind === 'sc-if') return { k: 'if', value: parseParts(n.getAttribute('value') || ''), kids: kids };
      if (kind === 'dc-import') {
        var attrs = attrList(n).filter(function (a) { return a[0] !== 'data-dc' && a[0] !== 'name' && a[0].indexOf('hint-') !== 0; });
        return { k: 'imp', name: n.getAttribute('name'), attrs: attrs };
      }
    }
    var src = tag === 'template' ? n.content.childNodes : n.childNodes;
    return { k: 'el', tag: tag, attrs: attrList(n), kids: compileNodes(src) };
  }
  function compileTemplate(html) {
    html = html
      .replace(/<(sc-for|sc-if|dc-import)(\s|>)/g, '<template data-dc="$1"$2')
      .replace(/<\/(sc-for|sc-if|dc-import)>/g, '</template>');
    var t = document.createElement('template');
    t.innerHTML = html;
    return compileNodes(t.content.childNodes);
  }

  // ---------- evaluation ----------
  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    var segs = path.split('.'), v = scope;
    for (var i = 0; i < segs.length; i++) {
      if (v == null) return undefined;
      v = v[segs[i]];
    }
    return v;
  }
  function evalParts(parts, scope) {
    if (parts.length === 1 && typeof parts[0] !== 'string') return lookup(parts[0].p, scope);
    var s = '';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (typeof p === 'string') s += p;
      else { var v = lookup(p.p, scope); s += v == null ? '' : String(v); }
    }
    return s;
  }
  function camel(s) { return s.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }); }
  function build(nodes, scope) {
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.k === 't') out.push({ type: '#text', text: String(evalParts(n.parts, scope) == null ? '' : evalParts(n.parts, scope)) });
      else if (n.k === 'el') {
        var props = {};
        for (var j = 0; j < n.attrs.length; j++) props[n.attrs[j][0]] = evalParts(n.attrs[j][1], scope);
        out.push({ type: n.tag, props: props, children: build(n.kids, scope) });
      } else if (n.k === 'if') {
        out.push({ type: '#frag', children: evalParts(n.value, scope) ? build(n.kids, scope) : [] });
      } else if (n.k === 'for') {
        var list = evalParts(n.list, scope) || [], kids = [];
        for (var x = 0; x < list.length; x++) {
          var s2 = Object.create(scope);
          s2[n.as] = list[x];
          s2.$index = x;
          kids.push({ type: '#frag', children: build(n.kids, s2) });
        }
        out.push({ type: '#frag', children: kids });
      } else if (n.k === 'imp') {
        var p2 = {};
        for (var a = 0; a < n.attrs.length; a++) p2[camel(n.attrs[a][0])] = evalParts(n.attrs[a][1], scope);
        out.push({ type: COMPONENTS[n.name], props: p2, children: [] });
      }
    }
    return out;
  }

  // ---------- DOM props ----------
  var BOOL = { disabled: 1, readonly: 1, checked: 1, hidden: 1, selected: 1, multiple: 1, required: 1, open: 1 };
  function setProps(dom, oldP, newP, svg) {
    var k;
    for (k in oldP) if (!(k in newP)) setProp(dom, k, undefined, oldP[k], svg);
    for (k in newP) {
      if (k === 'value' || k === 'checked') setProp(dom, k, newP[k], oldP[k], svg);
      else if (newP[k] !== oldP[k]) setProp(dom, k, newP[k], oldP[k], svg);
    }
  }
  function setProp(dom, name, v, old, svg) {
    if (name.length > 2 && name.charCodeAt(0) === 111 && name.charCodeAt(1) === 110) { // on*

      if (evt === 'change' && (dom.localName === 'input' && !/^(checkbox|radio|file)$/.test(dom.type) || dom.localName === 'textarea')) evt = 'input';
      var L = dom.__l || (dom.__l = {});
      if (!L[evt]) { L[evt] = { fn: null }; (function (rec) { dom.addEventListener(evt, function (e) { if (typeof rec.fn === 'function') rec.fn(e); }); })(L[evt]); }
      L[evt].fn = typeof v === 'function' ? v : null;
      return;
    }
    if (name === 'classname') name = 'class';
    if (name === 'htmlfor') name = 'for';
    if (!svg && name === 'value' && (dom.localName === 'input' || dom.localName === 'textarea' || dom.localName === 'select')) {
      var sv = v == null ? '' : String(v);
      if (dom.value !== sv) dom.value = sv;
      return;
    }
    if (typeof v === 'function') return;
    if (BOOL[name]) {
      var on = v === true || v === '' || v === name || v === 'true';
      if (on) dom.setAttribute(name, ''); else dom.removeAttribute(name);
      if (name === 'disabled' || name === 'checked') dom[name] = on;
      return;
    }
    if (v == null || (v === false && name.indexOf('aria-') !== 0)) dom.removeAttribute(name);
    else dom.setAttribute(name, v === true && name.indexOf('aria-') !== 0 ? '' : String(v));
  }

  // ---------- reconciler ----------
  var mountQueue = [];
  function firstNode(inst) {
    if (inst.dom) return inst.dom;
    return inst.kids.length ? firstNode(inst.kids[0]) : inst.anchor;
  }
  function mount(v, parent, before, svg) {
    var inst = { v: v, kids: [] };
    if (v.type === '#text') {
      inst.dom = document.createTextNode(v.text);
      parent.insertBefore(inst.dom, before);
    } else if (v.type === '#frag') {
      inst.anchor = document.createComment('');
      parent.insertBefore(inst.anchor, before);
      inst.kids = v.children.map(function (c) { return mount(c, parent, inst.anchor, svg); });
    } else if (typeof v.type === 'string') {
      var s2 = svg || v.type === 'svg';
      var dom = s2 ? document.createElementNS(SVG_NS, v.type) : document.createElement(v.type);
      inst.dom = dom;
      inst.svg = s2;
      setProps(dom, {}, v.props, s2);
      inst.kids = v.children.map(function (c) { return mount(c, dom, null, s2 && v.type !== 'foreignObject'); });
      parent.insertBefore(dom, before);
    } else if (typeof v.type === 'function') {
      inst.anchor = document.createComment(v.type.__name || '');
      parent.insertBefore(inst.anchor, before);
      inst.svg = svg;
      var c = new v.type(v.props);
      c.__inst = inst;
      c.__pending = [];
      inst.comp = c;
      inst.kids = c.__render().map(function (k) { return mount(k, parent, inst.anchor, svg); });
      if (c.componentDidMount) mountQueue.push(c);
    } else {
      inst.dom = document.createTextNode('');
      parent.insertBefore(inst.dom, before);
    }
    return inst;
  }
  function unmount(inst, remove) {
    if (inst.comp) {
      inst.comp.__dead = true;
      if (inst.comp.componentWillUnmount) try { inst.comp.componentWillUnmount(); } catch (e) { console.error(e); }
    }
    for (var i = 0; i < inst.kids.length; i++) unmount(inst.kids[i], remove && !inst.dom);
    if (remove) {
      if (inst.dom && inst.dom.parentNode) inst.dom.parentNode.removeChild(inst.dom);
      if (inst.anchor && inst.anchor.parentNode) inst.anchor.parentNode.removeChild(inst.anchor);
    }
  }
  function patch(inst, v, parent, svg) {
    var o = inst.v;
    if (o.type !== v.type) {
      var n = mount(v, parent, firstNode(inst), svg);
      unmount(inst, true);
      return n;
    }
    if (v.type === '#text') {
      if (o.text !== v.text) inst.dom.nodeValue = v.text;
    } else if (v.type === '#frag') {
      patchKids(inst, v.children, parent, inst.anchor, svg);
    } else if (typeof v.type === 'string') {
      setProps(inst.dom, o.props, v.props, inst.svg);
      patchKids(inst, v.children, inst.dom, null, inst.svg && v.type !== 'foreignObject');

      var c = inst.comp, prevProps = c.props;
      c.props = v.props;
      var prevState = c.__apply();
      dirty.delete(c);
      patchKids(inst, c.__render(), parent, inst.anchor, svg);
      if (c.componentDidUpdate) updQueue.push([c, prevProps, prevState]);
    }

    return inst;
  }
  function patchKids(inst, vs, parent, end, svg) {
    var old = inst.kids, next = [], i;

      if (i < old.length) next.push(patch(old[i], vs[i], parent, svg));
      else next.push(mount(vs[i], parent, end, svg));

  // ---------- components ----------
  var dirty = new Set(), updQueue = [], scheduled = false;
  function schedule() {
    if (scheduled) return;

  }
  function flush() {
    scheduled = false;
    var guard = 0;
    while (dirty.size && guard++ < 50) {
      var list = Array.from(dirty);
      dirty.clear();
      list.sort(function (a, b) { return a.__depth() - b.__depth(); });
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c.__dead || !c.__pending.length) continue;
        var prevState = c.__apply();
        var inst = c.__inst;
        patchKids(inst, c.__render(), inst.anchor.parentNode, inst.anchor, inst.svg);
        if (c.componentDidUpdate) updQueue.push([c, c.props, prevState]);
      }
      runQueues();
    }
  }
  function runQueues() {
    var m = mountQueue; mountQueue = [];
    m.forEach(function (c) { if (!c.__dead) try { c.componentDidMount(); } catch (e) { console.error(e); } });
    var u = updQueue; updQueue = [];
    u.forEach(function (r) { if (!r[0].__dead) try { r[0].componentDidUpdate(r[1], r[2]); } catch (e) { console.error(e); } });
  }

  function DCLogic(props) {
    this.props = props || {};
    this.state = {};
  }
  DCLogic.prototype.setState = function (p, cb) {
    if (this.__dead) return;
    this.__pending.push(p);
    dirty.add(this);
    schedule();

  };
  DCLogic.prototype.forceUpdate = function () { this.setState({}); };
  DCLogic.prototype.renderVals = function () { return {}; };

    var prev = this.state, s = prev;
    for (var i = 0; i < this.__pending.length; i++) {
      var p = this.__pending[i];
      if (typeof p === 'function') p = p(s, this.props);

    this.state = s;
    return prev;
  };
  DCLogic.prototype.__render = function () {
    var vals;

  };
  DCLogic.prototype.__depth = function () {
    var d = 0, inst = this.__inst;

  };

  // ---------- boot ----------
  window.DCBoot = function (defs, rootName, el, layout) {
    var seen = {};
    defs.forEach(function (d) {
      var Cls;
      try { Cls = d.factory(DCLogic); }
      catch (e) { console.error('Component ' + d.name, e); Cls = function (p) { DCLogic.call(this, p); }; Cls.prototype = Object.create(DCLogic.prototype); }
      Cls.__name = d.name;
      COMPONENTS[d.name] = Cls;
      var h = document.createElement('template');
      h.innerHTML = d.helmet;
      Array.prototype.forEach.call(h.content.children, function (n) {
        var key = n.outerHTML;
        if (seen[key]) return;
        seen[key] = 1;
        document.head.appendChild(n.cloneNode(true));
      });
    });
    defs.forEach(function (d) { COMPONENTS[d.name].__tpl = compileTemplate(d.template); });
    var routes = rootName; // [{id,title,group,comp,props}]
    var byId = {};
    routes.forEach(function (r) { byId[r.id] = r; });
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (href === '#demo') { e.preventDefault(); return; }
      var m = /^(?:\.\/|\/)?([\w.-]+)\.dc\.html$/.exec(href);
      if (m && byId[m[1]]) { e.preventDefault(); location.hash = '#/' + m[1]; }
    });
    var current = null;
    var fab = document.createElement('a');
    fab.href = '#/';
    fab.textContent = 'Back to canvas';
    fab.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:1000;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:#1F2A37;color:#fff;font:500 14px Kanit,system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)';
    function renderIndex() {
      var groups = {};
      routes.forEach(function (r) { (groups[r.group] = groups[r.group] || []).push(r); });
      var h = '<div style="max-width:1200px;margin:0 auto;padding:48px 16px;font-family:Kanit,system-ui,sans-serif;color:#1F2A37">' +
        '<h1 style="margin:0 0 8px;font-size:36px;font-weight:600">PayConnect Excel Submission</h1>' +
        '<p style="margin:0 0 32px;color:#4B5B6B;font-size:16px">Select a screen to open it.</p>';
      Object.keys(groups).forEach(function (g) {
        h += '<h2 style="margin:32px 0 16px;font-size:20px;font-weight:500">' + g + '</h2>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">';
        groups[g].forEach(function (r) {
          h += '<a href="#/' + r.id + '" style="display:flex;flex-direction:column;gap:6px;padding:20px;border:1px solid #DCE4EA;border-radius:10px;background:#fff;color:#1F2A37;text-decoration:none">' +
            '<span style="font-size:17px;font-weight:500">' + r.title + '</span>' +
            '<span style="font-size:13px;color:#00708D">' + r.id + '</span></a>';
        });
        h += '</div>';
      });
      el.innerHTML = h + '</div>';
    }
    // ---------- canvas view: every artboard at its canvas position, pan + zoom ----------
    var view = null; // {tx, ty, s}
    var canvasInsts = [];
    var cleanup = [];
    function renderCanvas() {
      var L = layout || { boards: {}, order: [], notes: {} };
      el.innerHTML = '';
      document.body.style.overflow = 'hidden';
      var vp = document.createElement('div');
      vp.style.cssText = 'position:fixed;inset:0;overflow:hidden;background:#EDEDED;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none';
      var world = document.createElement('div');
      world.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform';
      vp.appendChild(world);
      el.appendChild(vp);
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      function grow(x, y, w, h) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h); }
      (L.order || Object.keys(L.boards)).forEach(function (file) {
        var b = L.boards[file]; if (!b) return;
        var id = file.replace(/\.dc\.html$/, ''), r = byId[id]; if (!r) return;
        grow(b.x, b.y - 60, b.w, b.h + 60);
        var lab = document.createElement('div');
        lab.className = 'cv-label';
        lab.dataset.w = b.w;
        lab.style.cssText = 'position:absolute;left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;transform-origin:0 0;display:flex;align-items:center;gap:12px;font-family:Kanit,system-ui,sans-serif;color:#5B4FD6;white-space:nowrap';
        lab.innerHTML = '<span style="overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:500">' + (b.title || id) + '</span>' +
          '<a href="#/' + id + '" style="flex:none;display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border:1.5px solid #5B4FD6;border-radius:6px;color:#5B4FD6;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.06em;cursor:pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"></path></svg>PLAY</a>';
        world.appendChild(lab);
        var frame = document.createElement('div');
        frame.className = 'cv-frame';
        frame.style.cssText = 'position:absolute;left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h + 'px;overflow:hidden;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:auto;user-select:text;-webkit-user-select:text';
        world.appendChild(frame);
        canvasInsts.push(mount({ type: COMPONENTS[r.comp], props: Object.assign({}, r.props), children: [] }, frame, null, false));
      });
      Object.keys(L.notes || {}).forEach(function (k) {
        var n = L.notes[k];
        if (n.kind !== 'title1') return;
        var d = document.createElement('div');
        d.textContent = n.text;
        d.style.cssText = 'position:absolute;left:' + n.x + 'px;top:' + n.y + 'px;max-width:' + (n.maxW || 2000) + 'px;font:700 72px/1.1 Kanit,system-ui,sans-serif;color:#1F2A37;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
        world.appendChild(d);
        grow(n.x, n.y, Math.min(n.maxW || 1440, 2440), 90);
      });
      runQueues();

      // zoom controls
      var bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:1001;display:flex;align-items:center;gap:2px;padding:4px;background:#FFFFFF;border:1px solid #DCE4EA;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15);font:500 14px Kanit,system-ui,sans-serif;color:#1F2A37';
      var btn = 'min-width:40px;height:40px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:inherit;font:inherit;cursor:pointer';
      bar.innerHTML = '<button type="button" data-z="out" aria-label="Zoom out" style="' + btn + ';font-size:20px">−</button>' +
        '<button type="button" data-z="100" aria-label="Zoom to 100%" style="' + btn + ';min-width:64px" class="cv-pct">100%</button>' +
        '<button type="button" data-z="in" aria-label="Zoom in" style="' + btn + ';font-size:20px">+</button>' +
        '<span style="width:1px;height:24px;background:#DCE4EA;margin:0 4px"></span>' +
        '<button type="button" data-z="fit" style="' + btn + '">Fit all</button>';
      document.body.appendChild(bar);
      cleanup.push(function () { bar.remove(); });
      var pct = bar.querySelector('.cv-pct');
      var labels = world.querySelectorAll('.cv-label');

      var MIN = 0.02, MAX = 4;
      function apply() {
        world.style.transform = 'translate(' + view.tx + 'px,' + view.ty + 'px) scale(' + view.s + ')';
        var inv = 1 / view.s;
        for (var i = 0; i < labels.length; i++) {
          // labels keep a constant on-screen size, like the editor's name strips

        pct.textContent = Math.round(view.s * 100) + '%';
      }
      function zoomAt(ns, cx, cy) {
        ns = Math.max(MIN, Math.min(MAX, ns));

      function fit() {

        apply();
      }
      if (!view) fit(); else apply();
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var cx = vp.clientWidth / 2, cy = vp.clientHeight / 2, z = b.getAttribute('data-z');
        if (z === 'in') zoomAt(view.s * 1.25, cx, cy);
        else if (z === 'out') zoomAt(view.s / 1.25, cx, cy);
        else if (z === '100') zoomAt(1, cx, cy);
        else fit();
      });
      vp.addEventListener('wheel', function (e) {
        e.preventDefault();
        var r = vp.getBoundingClientRect();

the next upload:<\/span>\n<sc-for list=\"{{pills}}\" as=\"p\" hint-placeholder-count=\"7\">\n<sc-if value=\"{{p.on}}\" hint-placeholder-val=\"{{false}}\">\n<button type=\"button\" aria-pressed=\"true\" onClick=\"{{p.pick}}\" style=\"min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #FBBF24; background: #FBBF24; color: #1F2A37; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">{{p.label}}<\/button>\n<\/sc-if>\n<sc-if value=\"{{p.off}}\" hint-placeholder-val=\"{{true}}\">\n<button type=\"button\" aria-pressed=\"false\" onClick=\"{{p.pick}}\" style=\"min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #64748B; background: transparent; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 400; cursor: pointer\">{{p.label}}<\/button>\n<\/sc-if>\n<\/sc-for>\n<\/div>\n<div style=\"color: #CBD5E1; font-size: 13px\">Try it: Add New Submission &gt; Browse &gt; Import. Use Back to Summary to see the new task in the list, then View to open its details. A Stage 5 failure shows Retry, which resends without a new upload. Invalid file shows the file error after Browse and keeps Import disabled. Configuration (next to Add New Submission) opens the PayConnect Configuration page.<\/div>\n<\/section>\n\n<sc-if value=\"{{onSummary}}\" hint-placeholder-val=\"{{true}}\">\n<dc-import name=\"2-Main\" demo=\"{{true}}\" demo-rows=\"{{rows}}\" on-open=\"{{openTask}}\" on-new=\"{{goNew}}\" on-config=\"{{goConfig}}\" hint-size=\"100%,1900px\"><\/dc-import>\n<\/sc-if>\n<sc-if value=\"{{onNew}}\" hint-placeholder-val=\"{{false}}\">\n<dc-import name=\"3-NewSubmission\" demo=\"{{true}}\" outcome=\"{{outcome}}\" task-no=\"{{taskNo}}\" on-back=\"{{goSummary}}\" on-start=\"{{runStart}}\" on-finish=\"{{runFinish}}\" on-leave=\"{{runLeave}}\" hint-size=\"100%,1900px\"><\/dc-import>\n<\/sc-if>\n<sc-if value=\"{{onDetail}}\" hint-placeholder-val=\"{{false}}\">\n<dc-import name=\"4-SubmissionDetail\" demo=\"{{true}}\" scenario=\"{{detail.scenario}}\" demo-outcome=\"{{detail.outcome}}\" demo-task=\"{{detail.task}}\" demo-at=\"{{detail.at}}\" demo-retried=\"{{detail.retried}}\" on-back=\"{{goSummary}}\" hint-size=\"100%,2400px\"><\/dc-import>\n<\/sc-if>\n<sc-if value=\"{{onConfig}}\" hint-placeholder-val=\"{{false}}\">\n<dc-import name=\"5-PayConnectConfig\" demo=\"{{true}}\" on-back=\"{{goSummary}}\" hint-size=\"100%,1950px\"><\/dc-import>\n<\/sc-if>\n\n<\/div>",factory:function(DCLogic){

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  fresh() {
    return { screen: 'summary', outcome: 'success', runs: [], nextTask: 97, activeTask: null, detail: { scenario: 'success', outcome: '', task: '', at: 0, retried: false } };
  }
  updateRun(task, patch) {
    this.setState({ runs: this.state.runs.map((r) => (r.task === task ? Object.assign({}, r, patch) : r)) });
  }
  renderVals() {
    const st = this.state;
    const DAY = '05/11/2026 ';
    const END = {
      success: ['10:23:13', '15 sec', '558'],
      retried: ['10:26:06', '3 min 8 sec', '558'],
      fail1: ['10:22:59', '1 sec', '–'],
      fail2: ['10:23:01', '3 sec', '–'],
      fail3: ['10:23:07', '9 sec', '558'],
      fail4: ['10:23:10', '12 sec', '558'],
      fail5: ['10:23:42', '44 sec', '558']
    };
    const rows = st.runs.map((r) => {
      if (r.status === 'proc') return { task: r.task, status: 'proc', start: DAY + '10:22:58', done: '–', dur: 'In progress', total: '558', demoRun: true };
      const e = END[r.retried ? 'retried' : r.outcome];
      return { task: r.task, status: r.outcome === 'success' ? 'ok' : 'fail', start: DAY + '10:22:58', done: DAY + e[0], dur: e[1], total: e[2], demoRun: true };
    });
    const OUT = [['success', 'Success'], ['fail1', 'Fail at Stage 1'], ['fail2', 'Fail at Stage 2'], ['fail3', 'Fail at Stage 3'], ['fail4', 'Fail at Stage 4'], ['fail5', 'Fail at Stage 5'], ['invalid', 'Invalid file']];
    const pills = OUT.map(([id, label]) => ({ label, on: st.outcome === id, off: st.outcome !== id, pick: () => this.setState({ outcome: id }) }));
    const LABEL = { summary: 'Summary', new: 'New Submission', detail: 'Submission Detail', config: 'PayConnect Configuration' };
    const STATIC = { '96': 'fail5', '93': 'fail3', '90': 'fail2' };
    return {
      pills,
      rows,
      outcome: st.outcome,
      taskNo: st.activeTask || String(st.nextTask),
      detail: st.detail,
      screenLabel: LABEL[st.screen],
      onSummary: st.screen === 'summary',
      onNew: st.screen === 'new',
      onDetail: st.screen === 'detail',
      onConfig: st.screen === 'config',
      goConfig: () => this.setState({ screen: 'config' }),
      restart: () => this.setState(this.fresh()),
      goSummary: () => this.setState({ screen: 'summary' }),
      goNew: () => this.setState({ screen: 'new', activeTask: null }),
      openTask: (row) => {
        if (row && row.demoRun) {
          const run = this.state.runs.find((r) => r.task === row.task) || {};
          const outcome = run.status === 'proc' ? 'processing' : run.outcome;
          this.setState({ screen: 'detail', detail: { scenario: 'success', outcome, task: run.task, at: run.at || 1, retried: !!run.retried } });
        } else {
          const task = row ? row.task : '';
          this.setState({ screen: 'detail', detail: { scenario: STATIC[task] || 'success', outcome: '', task: '', at: 0, retried: false } });
        }
      },
      runStart: () => {
        const task = String(this.state.nextTask);
        this.setState({ activeTask: task, nextTask: this.state.nextTask + 1, runs: [{ task, status: 'proc', at: 1, outcome: '', retried: false }].concat(this.state.runs) });
      },
      runFinish: (result, retried) => {
        const task = this.state.activeTask;
        if (task) this.updateRun(task, { status: 'done', outcome: result, retried: !!retried });
      },
      runLeave: (cur) => {
        const task = this.state.activeTask;
        if (task) this.updateRun(task, { at: cur });
      }
    };
  }
}

      success: { label: 'Success', bg: '#E7F6EC', fg: '#15803D' },
      fail: { label: 'Fail', bg: '#FDECEA', fg: '#B42318' },
      running: { label: 'In progress', bg: '#E6F4F8', fg: '#00708D' },
      pending: { label: 'Waiting', bg: '#EEF2F5', fg: '#4B5B6B' },
      skipped: { label: 'Not started', bg: '#EEF2F5', fg: '#4B5B6B' }
    };
    const DEFS = [
      { id: 1, name: 'Import Excel Data', desc: 'Read the uploaded Excel file', dur: '2 sec', failDur: '1 sec' },
      { id: 2, name: 'Verify Excel Structure', desc: 'Check sheets, columns and headers against the template', dur: '1 sec', failDur: '1 sec' },
      { id: 3, name: 'Verify Data and Account Template', desc: 'Validate each row and match accounts to the account template', dur: '6 sec', failDur: '6 sec' },
      { id: 4, name: 'Convert Data to PayConnect Structure', desc: 'Build the PayConnect batch file', dur: '4 sec', failDur: '3 sec' },
      { id: 5, name: 'Interface to PayConnect', desc: 'Send the transactions to PayConnect by API', dur: '1 sec', failDur: '30 sec' }
    ];

    const stages = DEFS.map((d) => {
      const st = statusOf(d.id);
      const ok = st === 'success';
      const fail = st === 'fail';
      const canExpand = ok || fail;
      const expanded = canExpand && !!exp[d.id];
      const t = TAG[st];
      const body = (n, cond) => expanded && d.id === n && cond;
      return {
        id: d.id, name: d.name, desc: d.desc,
        tagLabel: t.label, tagBg: t.bg, tagFg: t.fg,
        isSuccess: ok, isFail: fail, isRunning: st === 'running', isIdle: st === 'pending' || st === 'skipped',
        titleColor: st === 'pending' || st === 'skipped' ? '#4B5B6B' : '#1F2A37',
        bg: fail ? '#FFFAF9' : '#FFFFFF',
        border: fail ? '#F3B7B0' : st === 'running' ? '#7FB3C6' : '#DCE4EA',
        hasDur: canExpand, dur: fail ? d.failDur : d.dur,
        canExpand, expanded, collapsed: canExpand && !expanded,
        toggleLabel: expanded ? 'Collapse' : (fail ? 'More details' : 'Expand'),
        toggle: () => this.setState({ expanded: { ...exp, [d.id]: !exp[d.id] } }),
        showDownload: ok && (d.id === 1 || d.id === 4),
        showRetry: fail && d.id === 5,
        b1: body(1, ok), b1fail: body(1, fail),
        b2: body(2, ok), b2fail: body(2, fail),
        b3ok: body(3, ok), b3fail: body(3, fail),
        b4: body(4, ok), b4fail: body(4, fail),
        b5ok: body(5, ok), b5fail: body(5, fail)
      };
    });

    const statuses = DEFS.map((d) => statusOf(d.id));
    const done = statuses.filter((s) => s === 'success').length;
    const pct = Math.round((done / 5) * 100);

    const OVERALL = failAt ? { label: 'Fail', bg: '#FDECEA', fg: '#B42318' } : ({
      ready: { label: 'Ready to import', bg: '#EEF2F5', fg: '#4B5B6B' },
      running: { label: 'Processing', bg: '#E6F4F8', fg: '#00708D' },
      processing: { label: 'Processing', bg: '#E6F4F8', fg: '#00708D' },
      success: { label: 'Success', bg: '#E7F6EC', fg: '#15803D' }
    })[mode];

    const ERR = {
      1: ['Processing stopped at Stage 1: Import Excel Data.', 'The file could not be opened. Check that it is a valid .xlsx or .xls file with no password, then upload it again.'],
      2: ['Processing stopped at Stage 2: Verify Excel Structure.', '2 required columns are missing and 1 header does not match the account template. Update the file, then upload it again.'],
      3: ['Processing stopped at Stage 3: Verify Data and Account Template.', '3 rows have errors. Correct the source file, then upload it again.'],
      4: ['Processing stopped at Stage 4: Convert Data to PayConnect Structure.', '2 rows could not be converted to the PayConnect format. Correct the source file, then upload it again.']
    };

    const LV = {
      INFO: ['#EEF2F5', '#4B5B6B'], SUCCESS: ['#E7F6EC', '#15803D'],
      ERROR: ['#FDECEA', '#B42318'], WARN: ['#FEF3E2', '#B45309']
    };
    const D = '05/11/2026 ';
    const logs = [];
    const add = (t, lvl, stage, msg) => logs.push({ t: D + t, lvl, stage, msg, bg: LV[lvl][0], fg: LV[lvl][1] });
    const fileName = this.state.fileName;
    const stopUpload = 'Process stopped. Correct the source file and upload it again.';
    if (mode !== 'ready') {
      add('10:22:58', 'INFO', 'Import Excel Data', 'File "' + fileName + '" uploaded by [User Name]');
      if (statuses[0] === 'success') add('10:23:00', 'SUCCESS', 'Import Excel Data', '558 rows read from sheet "Transfer"');
      if (statuses[0] === 'fail') {
        add('10:22:59', 'ERROR', 'Import Excel Data', 'Cannot open the file. It may be password-protected or damaged.');
        add('10:22:59', 'WARN', 'Import Excel Data', 'Process stopped. Upload a valid Excel file to continue.');
      }
      if (statuses[1] === 'success') add('10:23:01', 'SUCCESS', 'Verify Excel Structure', '20 of 20 required columns found');
      if (statuses[1] === 'fail') {
        add('10:23:01', 'ERROR', 'Verify Excel Structure', 'Required column "Bank Code" not found');
        add('10:23:01', 'ERROR', 'Verify Excel Structure', 'Required column "Amount" not found');
        add('10:23:01', 'ERROR', 'Verify Excel Structure', 'Column E header "Acct No" does not match "Account No."');
        add('10:23:01', 'WARN', 'Verify Excel Structure', stopUpload);
      }
      if (statuses[2] === 'success') add('10:23:07', 'SUCCESS', 'Verify Data', '558 of 558 rows passed account template checks');
      if (statuses[2] === 'fail') {
        add('10:23:07', 'ERROR', 'Verify Data', 'Row 14: Account number must be 10 digits');
        add('10:23:07', 'ERROR', 'Verify Data', 'Row 27: Amount must be greater than 0');
        add('10:23:07', 'ERROR', 'Verify Data', 'Row 102: Bank code not found in the account template');
        add('10:23:07', 'WARN', 'Verify Data', stopUpload);
      }
      if (statuses[3] === 'success') add('10:23:11', 'SUCCESS', 'Convert Data', 'PAYCONNECT_T' + (this.props.taskNo || '97') + '_20261105.csv created (558 records)');
      if (statuses[3] === 'fail') {
        add('10:23:10', 'ERROR', 'Convert Data', 'Row 45: Payee Name is longer than the PayConnect field limit');
        add('10:23:10', 'ERROR', 'Convert Data', 'Row 311: Remark contains characters PayConnect does not accept');
        add('10:23:10', 'WARN', 'Convert Data', stopUpload);
      }
      if (statuses[4] !== 'pending' && statuses[4] !== 'skipped') add('10:23:12', 'INFO', 'Interface to PayConnect', 'Sending 558 transactions to PayConnect');
      if (statuses[4] === 'fail' || retried) {
        add('10:23:42', 'ERROR', 'Interface to PayConnect', 'HTTP 503 Service Unavailable: connection timed out after 30 seconds');
        add('10:23:42', 'WARN', 'Interface to PayConnect', 'Process stopped. Retry is available.');
      }
      if (retried && statuses[4] !== 'fail') add('10:26:05', 'INFO', 'Interface to PayConnect', 'Retry requested by [User Name]. Resending 558 transactions');
      if (statuses[4] === 'success') add(retried ? '10:26:06' : '10:23:13', 'SUCCESS', 'Interface to PayConnect', 'PayConnect accepted 558 of 558 transactions');
    }

    const expandable = stages.filter((s) => s.canExpand);
    const allOpen = expandable.length > 0 && expandable.every((s) => s.expanded);
    const isRunning = mode === 'running' || mode === 'processing';
    const hasFile = (mode !== 'ready' || this.state.picked) && !invalid;
    const importOff = isRunning || !hasFile;
    const errFor = failAt && failAt < 5 ? ERR[failAt] : ['', ''];

    return {
      stages,
      logs,
      hasLogs: logs.length > 0,
      noLogs: logs.length === 0,
      fileName,
      shownFile: invalid ? 'Payroll_Transfer_Nov2026.pdf' : hasFile ? fileName : '',
      invalid,
      ariaInvalid: invalid ? 'true' : 'false',
      boxBorder: invalid ? '1px solid #E52929' : '1px dashed #7FB3C6',
      boxBg: invalid ? '#FFFFFF' : '#F5FAFC',
      fileIconColor: invalid ? '#E52929' : '#00708D',
      hasFile,
      importOff,
      importOpacity: importOff ? '0.5' : '1',
      pct,
      progressLabel: done + ' of 5 stages completed',
      barColor: failAt ? '#B42318' : done === 5 ? '#15803D' : '#00708D',
      overall: OVERALL,
      started: mode !== 'ready',
      notStarted: mode === 'ready',
      running: isRunning,
      btnOpacity: isRunning ? '0.5' : '1',
      importLabel: isRunning ? 'Importing…' : 'Import',
      alertRunning: isRunning,
      alertError: failAt > 0 && failAt < 5,
      alertRetry: failAt === 5,
      alertSuccess: mode === 'success',
      errTitle: errFor[0],
      errText: errFor[1],
      sendTime: retried ? '05/11/2026 10:26:05' : '05/11/2026 10:23:12',
      attempts: retried ? '2' : '1',
      toggleAllLabel: allOpen ? 'Collapse all' : 'Expand all',
      toggleAll: () => {
        const next = {};
        if (!allOpen) expandable.forEach((s) => { next[s.id] = true; });
        this.setState({ expanded: next });
      },
      openFailed: () => this.setState({ expanded: { ...exp, [failAt]: true } }),
      taskNo: this.props.taskNo || '97',
      convName: 'PAYCONNECT_T' + (this.props.taskNo || '97') + '_20261105.csv',
      backHref: this.props.demo ? '#demo' : '2-Main.dc.html',
      goBack: () => { if (this.props.demo && this.props.onBack) this.props.onBack(); },

        const again = this.state.picked || (sc !== 'ready' && sc !== 'invalid');
        this.setState({ override: 'ready', cur: null, retried: false, expanded: {}, picked: true, invalid: false, fileName: again ? 'Payroll_Transfer_Nov2026_v2.xlsx' : 'Payroll_Transfer_Nov2026.xlsx' });
      }
    };
  }
